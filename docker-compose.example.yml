# Example overlays — copy ideas into your own compose or Unraid template.
# Host paths below are EXAMPLES only; set them for your machine.

services:
  invoke-library:
    build: .
    container_name: invoke-library
    ports:
      - "8091:8080"
    environment:
      INVOKE_BASE_URL: "http://192.168.1.12:9091"
      INVOKE_API_TOKEN: ""   # JWT from multi-user login; leave empty for single-user
      # INVOKE_API_KEY: ""   # optional alternate header style
      INVOKE_OUTPUTS_DIR: /data/invoke-outputs
      KEEP_DIR: /data/keepers
      # FRIENDS_DIR: /data/keepers   # back-compat alias for KEEP_DIR
      CONFIG_DIR: /data/config
      IMAGE_SUBDIR: images
      APP_TITLE: "Invoke Library"
      KEEP_LABEL: "Keepers"
      # BASIC_AUTH_USER: admin
      # BASIC_AUTH_PASSWORD: change-me
      PORT: "8080"
    volumes:
      # --- Unraid example (adjust share names) ---
      # - /mnt/user/appdata/invokeai/outputs:/data/invoke-outputs:ro
      # - /mnt/user/Friends:/data/keepers
      # - /mnt/user/appdata/invoke-library:/data/config
      #
      # --- Generic Linux example ---
      - /path/to/invokeai/outputs:/data/invoke-outputs:ro
      - /path/to/keepers:/data/keepers
      - /path/to/invoke-library-config:/data/config
    restart: unless-stopped
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/mbriney/invoke-library/main/unraid/icon.png"
      net.unraid.docker.webui: "http://[IP]:[PORT:8080]/"
